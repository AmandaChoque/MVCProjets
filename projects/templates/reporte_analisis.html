{% extends 'base.html' %}
{% block content %}
<div class="container-fluid py-3">

  <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h5 class="fw-semibold text-secondary mb-0">Análisis de Proyectos (Distribución)</h5>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-header bg-light py-2">
      <span class="fw-semibold small">Distribución de Proyectos por Estado</span>
    </div>
    <div class="card-body text-center py-4">
      <img src="data:image/png;base64,{{ graphic }}" alt="Gráfico de Estado de Proyectos"
           class="img-fluid" style="max-height:400px;">
    </div>
  </div>

</div>
{% endblock %}
